<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Print | طرق الدفع</title>
<meta name="theme-color" content="#f5f5f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f6; --ink:#111113; --muted:#5f636c; --card:#ffffff; --line:#e3e4e8;
    --red:#e3000f; --black:#111113;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d0d0f; --ink:#f4f4f5; --muted:#a2a6af; --card:#1a1a1d; --line:#2b2c31; --black:#f4f4f5; }
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  main{width:100%; max-width:440px}
  header{text-align:center; padding:12px 0 26px}
  .logo{display:block; width:min(250px,70%); height:auto; margin:0 auto 18px; border-radius:16px; background:#fff; box-shadow:0 6px 22px rgba(0,0,0,.14)}
  h1{font-size:2rem; font-weight:800; letter-spacing:.2px; direction:ltr}
  header p{color:var(--red); font-weight:700; margin-top:6px; font-size:1.02rem}


  nav{display:grid; gap:10px}
  .link{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line);
    border-inline-start:6px solid var(--accent);
    border-radius:12px; padding:15px 16px; font-weight:700; font-size:1.08rem;
  }
  .link small{display:block; color:var(--muted); font-weight:400; font-size:.88rem; margin-top:1px}
  .link svg{flex:none; width:26px; height:26px; fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .link:active{background:var(--line)}
  .copy:focus-visible{outline:3px solid var(--red); outline-offset:2px}

  .pay{display:grid; gap:10px}
  .item{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line);
    border-inline-start:6px solid var(--accent);
    border-radius:12px; padding:14px 16px;
  }
  .info{flex:1; min-width:0}
  .info b{display:block; font-size:1.05rem; font-weight:700}
  .num{display:block; margin-top:4px; direction:ltr; text-align:start; font-size:1.12rem; font-weight:800; letter-spacing:.6px; word-break:break-all; user-select:all}
  [dir=rtl] .num{text-align:right}
  .copy{
    flex:none; display:flex; align-items:center; gap:6px; border:0; cursor:pointer;
    background:var(--red); color:#fff; border-radius:10px; padding:11px 14px;
    font:700 .95rem "Tajawal",sans-serif; min-width:88px; justify-content:center;
  }
  .copy:active{transform:scale(.97)}
  .copy.done{background:#16a34a}
  .copy svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:26px; direction:ltr}
</style>
</head>

    <h1>Best Print</h1>
    <p>طرق الدفع</p>

  <section class="pay" id="pay"></section>
  <footer>Best Print</footer>
</main>

<script>
/* ============ عدّل البيانات دي بس ============ */
const ACCOUNTS = [
  { title:"حساب بنك QNB",              number:"1000444215" },
  { title:"حساب بنك CIB",              number:"100053921269" },
  { title:"حساب البنك الأهلي المصري",   number:"0743071032341601013" },
  { title:"فودافون كاش",               number:"01018000026" },
  { title:"إنستا باي",                  number:"01006693836" }
];
/* ============================================ */

const copyIcon = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const okIcon = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function legacyCopy(text){
  const t = document.createElement("textarea");
  t.value = text;
  t.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
  document.body.appendChild(t);
  t.focus(); t.select(); t.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  t.remove();
  return ok;
}
function copyText(text){
  /* نسخ فوري أثناء الضغطة (يشتغل على كل الموبايلات) */
  const ok = legacyCopy(text);
  if(!ok && navigator.clipboard){
    try{ navigator.clipboard.writeText(text).catch(function(){}); }catch(e){}
  }
}

const box = document.getElementById("pay");
ACCOUNTS.forEach(function(acc, n){
  const d = document.createElement("div");
  d.className = "item";
  d.style.setProperty("--accent", n % 2 === 0 ? "var(--red)" : "var(--black)");
  d.innerHTML = '<div class="info"><b></b><span class="num"></span></div>' +
                '<button class="copy" type="button">' + copyIcon + '<span>نسخ</span></button>';
  d.querySelector("b").textContent = acc.title;
  d.querySelector(".num").textContent = acc.number;
  const btn = d.querySelector(".copy");
  btn.addEventListener("click", function(){
    copyText(acc.number);
    btn.classList.add("done");
    btn.innerHTML = okIcon + '<span>تم النسخ</span>';
    clearTimeout(btn._t);
    btn._t = setTimeout(function(){
      btn.classList.remove("done");
      btn.innerHTML = copyIcon + '<span>نسخ</span>';
    }, 1800);
  });
  box.appendChild(d);
});
</script>
